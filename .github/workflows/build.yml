name: Build Xeit Ai APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Unzip project
        run: unzip -q xeit-ai.zip
      - name: Find project folder
        run: |
          if [ -f xeit-ai/package.json ]; then echo "APP_DIR=xeit-ai" >> $GITHUB_ENV; else echo "APP_DIR=." >> $GITHUB_ENV; fi
      - run: npm install --legacy-peer-deps
        working-directory: ${{ env.APP_DIR }}
      - run: npx expo install --fix -- --legacy-peer-deps
        working-directory: ${{ env.APP_DIR }}
      - run: npx expo prebuild --platform android --no-install
        working-directory: ${{ env.APP_DIR }}
      - run: echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g" >> android/gradle.properties
        working-directory: ${{ env.APP_DIR }}
      - run: chmod +x gradlew && ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a
        working-directory: ${{ env.APP_DIR }}/android
      - uses: actions/upload-artifact@v4
        with:
          name: Xeit-Ai-apk
          path: ${{ env.APP_DIR }}/android/app/build/outputs/apk/release/*.apk
          
